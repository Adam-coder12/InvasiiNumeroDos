<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Invasii - The Invasive Species Identifier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(180deg, #1a2e1a 0%, #0d1f0d 100%);
            color: #d4e8d4;
            min-height: 100vh;
        }
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .hidden { display: none !important; }
        h1 {
            font-size: 4rem;
            font-weight: 400;
            font-style: oblique;
            margin-bottom: 5px;
            color: #a8d5a2;
            text-align: center;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            font-style: oblique;
            margin-bottom: 25px;
            color: #a8d5a2;
            text-align: center;
        }
        .button-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .start-btn {
            color: #e8f5e8;
            border: 1px solid #000;
            padding: 20px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(45, 90, 39, 0.5);
        }
        .start-btn:active { transform: scale(0.96); }
        #btn-autumn { background: linear-gradient(135deg, #da201a, #db810a); }
        #btn-spring { background: linear-gradient(135deg, #c66bdd, #6c0286); }
        .back-btn {
            background: none;
            border: 1px solid #5a9a4a;
            color: #a8d5a2;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 16px;
        }
        #webcam-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            border: 2px solid #3a6b33;
            min-width: 200px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            padding: 4px;
            text-align: center;
        }
        #webcam-container canvas {
            display: block;
            border-radius: 14px;
        }
        #label-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #label-container div {
            background: rgba(30, 60, 30, 0.6);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid rgba(90, 154, 74, 0.3);
            transition: background 0.3s, border-color 0.3s;
        }
        #label-container div.best {
            background: rgba(74, 124, 63, 0.4);
            border-color: #7bc46a;
            color: #c8f0c0;
        }
        #scan {
          justify-content: flex-start;
          padding-top: 12px;
        }
    </style>
</head>
<body>

<!-- HLAVNÁ STRÁNKA -->
<div id="menu" class="page">
    <h1>Invasii</h1>
    <h2>- The Invasive Plants Finder Model -</h2>
    <div class="button-container">
        <button type="button" id="btn-autumn" class="start-btn">Autumn Mode</button>
        <button type="button" id="btn-spring" class="start-btn">Spring Mode</button>
    </div>
</div>

<!-- PODSTRÁNKA -->
<div id="scan" class="page hidden">
    <button type="button" class="back-btn" id="back-btn">← Back to Menu</button>
    <h2 id="scan-title"></h2>
    <div id="webcam-container"></div>
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
const URL_AUTUMN = "https://teachablemachine.withgoogle.com/models/ql8UVS0Rk/";
const URL_SPRING = "https://teachablemachine.withgoogle.com/models/t3D41cELc/";

let model, webcam, labelContainer, maxPredictions, lastPrediction = 0;
let running = false;

const menu = document.getElementById("menu");
const scan = document.getElementById("scan");
const webcamContainer = document.getElementById("webcam-container");

document.getElementById("btn-autumn").addEventListener("click", () => start(URL_AUTUMN, "Autumn Mode"));
document.getElementById("btn-spring").addEventListener("click", () => start(URL_SPRING, "Spring Mode"));
document.getElementById("back-btn").addEventListener("click", stop);

async function start(baseURL, title) {
    menu.classList.add("hidden");
    scan.classList.remove("hidden");
    document.getElementById("scan-title").textContent = title;

    webcamContainer.textContent = "Načítavam...";
    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";

    try {
        model = await tmImage.load(baseURL + "model.json", baseURL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(200, 200, false);
        try {
            await webcam.setup({ facingMode: { exact: "environment" } });
        } catch (e) {
            // fallback pre zariadenia bez zadnej kamery (napr. počítač)
            webcam = new tmImage.Webcam(200, 200, false);
            await webcam.setup();
        }
        await webcam.play();

        webcamContainer.innerHTML = "";
        webcamContainer.appendChild(webcam.canvas);

        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }

        running = true;
        requestAnimationFrame(loop);
    } catch (err) {
        console.error(err);
        webcamContainer.textContent = "Chyba: " + err.message;
    }
}

async function stop() {
    running = false;
    if (webcam) {
        try { await webcam.stop(); } catch (e) {}
        webcam = null;
    }
    scan.classList.add("hidden");
    menu.classList.remove("hidden");
}

async function loop(timestamp) {
    if (!running || !webcam) return;
    webcam.update();
    if (timestamp - lastPrediction > 150) {
        await predict();
        lastPrediction = timestamp;
    }
    requestAnimationFrame(loop);
}

async function predict() {
    if (!model || !webcam) return;
    const prediction = await model.predict(webcam.canvas);
    let bestIdx = 0;
    for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > prediction[bestIdx].probability) bestIdx = i;
    }
    for (let i = 0; i < maxPredictions; i++) {
        const el = labelContainer.childNodes[i];
        if (el) {
            el.textContent = prediction[i].className + "  " + (prediction[i].probability * 100).toFixed(0) + "%";
            el.classList.toggle("best", i === bestIdx);
        }
    }
}
</script>
</body>
</html>
