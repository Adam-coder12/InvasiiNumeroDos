<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Invasii</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(180deg, #1a2e1a 0%, #0d1f0d 100%);
            color: #d4e8d4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            justify-content: center;
        }   
        h1 {
            font-size: 4rem;
            font-weight: 400;
            font-style: oblique;
            margin-bottom: 5px;
            color: #a8d5a2;
            text-align: center;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            font-style: oblique;
            margin-bottom: 25px;
            color: #a8d5a2;
            text-align: center;
        }
        #start-btn1 {
            background: linear-gradient(135deg, #da201a, #db810a);
            color: #e8f5e8;
            border: 1px solid #000000;
            padding: 20px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(45, 90, 39, 0.5);
        }
        #start-btn2 {
            background: linear-gradient(135deg, #c66bdd, #6c0286);
            color: #e8f5e8;
            border: 1px solid #000000;
            padding: 20px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(45, 90, 39, 0.5);
        }
        .hidden { display: none !important; }
        .button-container {
            display: flex;
            gap: 20px;
        }
        #webcam-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            border: 2px solid #3a6b33;
        }
        #label-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #label-container div {
            background: rgba(30, 60, 30, 0.6);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid rgba(90, 154, 74, 0.3);
        }
        #label-container div.best {
            background: rgba(74, 124, 63, 0.4);
            border-color: #7bc46a;
            color: #c8f0c0;
        }
    </style>
</head>
<body>
<h1>Invasii</h1>
<h2>- The Invasive Plants Finder Model -</h2>
<div class="button-container">
    <button type="button" id="start-btn1" onclick="init1()">Autumn Mode</button>
    <button type="button" id="start-btn2" onclick="init2()">Spring Mode</button>
</div>

<div id="webcam-container"></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
const URL1 = "https://teachablemachine.withgoogle.com/models/ql8UVS0Rk/";
const URL2 = "https://teachablemachine.withgoogle.com/models/t3D41cELc/";
let model, webcam, labelContainer, maxPredictions, lastPrediction = 0;

async function init1() {
    document.getElementById("start-btn1").classList.add("hidden");
    document.getElementById("start-btn2").classList.add("hidden");

    // Vyčistenie starých kontajnerov
    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("label-container").innerHTML = "";

    model = await tmImage.load(URL1 + "model.json", URL1 + "metadata.json");
    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(200, 200, false);
    await webcam.setup({ facingMode: "environment" });
    await webcam.play();
    requestAnimationFrame(loop);

    document.getElementById("webcam-container").appendChild(webcam.canvas);
    labelContainer = document.getElementById("label-container");
    for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
    }
}

async function init2() {
    document.getElementById("start-btn1").classList.add("hidden");
    document.getElementById("start-btn2").classList.add("hidden");

    // Vyčistenie starých kontajnerov
    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("label-container").innerHTML = "";

    model = await tmImage.load(URL2 + "model.json", URL2 + "metadata.json");
    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(200, 200, false);
    await webcam.setup({ facingMode: "environment" });
    await webcam.play();
    requestAnimationFrame(loop);

    document.getElementById("webcam-container").appendChild(webcam.canvas);
    labelContainer = document.getElementById("label-container");
    for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
    }
}

async function loop(timestamp) {
    if (!webcam) return;
    webcam.update();
    if (timestamp - lastPrediction > 150) {
        await predict();
        lastPrediction = timestamp;
    }
    requestAnimationFrame(loop);
}

async function predict() {
    if (!model || !webcam) return;
    const prediction = await model.predict(webcam.canvas);
    let bestIdx = 0;
    for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > prediction[bestIdx].probability) bestIdx = i;
    }
    for (let i = 0; i < maxPredictions; i++) {
        const el = labelContainer.childNodes[i];
        if (el) {
            el.textContent = prediction[i].className + "  " + (prediction[i].probability * 100).toFixed(0) + "%";
            el.classList.toggle("best", i === bestIdx);
        }
    }
}
</script>
</body>
</html>
